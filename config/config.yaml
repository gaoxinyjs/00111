# 系统配置
system:
  name: "Crypto Trading System"
  version: "1.0.0"
  environment: "development"  # development, staging, production
  debug: true
  
# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    trading: "logs/trading/trading.log"
    system: "logs/system/system.log"
    error: "logs/error/error.log"
    trade_records: "logs/trading/trade_records.log"
  rotation:
    max_bytes: 10485760  # 10MB
    backup_count: 5

# 数据库配置
database:
  postgresql:
    host: "localhost"
    port: 5432
    database: "trading_db"
    user: "trading_user"
    password: "${DB_PASSWORD}"
  
  influxdb:
    host: "localhost"
    port: 8086
    database: "trading_data"
    username: "${INFLUX_USER}"
    password: "${INFLUX_PASSWORD}"
  
  redis:
    host: "localhost"
    port: 6379
    password: "${REDIS_PASSWORD}"

# 任务调度
scheduler:
  data_collection_interval: 60  # 秒
  signal_generation_interval: 900  # 秒（15分钟周期 - 每15分钟执行一次DeepSeek分析）
  risk_check_interval: 30  # 秒
  performance_update_interval: 3600  # 秒

